name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out betting service
        uses: actions/checkout@v4
        with:
          path: betting

      - name: Check out fixed shared protocol
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/sportsbook-shared-protocol
          ref: sportsbook-v2.0.0
          path: shared

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install shared protocol 0.3.0
        working-directory: shared
        run: ./mvnw -B -DskipTests install

      - name: Verify betting service
        working-directory: betting
        run: ./mvnw -B verify
